  dispatch:
    openfoam:
      symbol: controlDict application
      file: applications/solvers/incompressible/simpleFoam/simpleFoam.C
    classification: DISPATCH
    brae_status: REIMPLEMENT
    brae_cuda: src/applications/solvers/simpleFoam/simpleFoamV2.cu
    brae_target: src/applications/solvers/simpleFoam/simpleFoamV2.cu
    validation: "tests/simplefoam_v2_dispatch.sh (ctest: simplefoam_v2_dispatch) -- drives the real binary on real cases: OFF changes nothing and stays silent; ON+supported runs to endTime and writes; ON+unsupported REFUSES with the reason and exits 1 for each of MRF, fvOptions, SIMPLEC, a non-upwind div(phi,U), a transient ddtScheme and RAS; the GAMG->AMG-PCG substitution is announced; RAS/kEpsilon RUNS and writes k/epsilon/nut with a control that nut changed. Negative control: the guard admits the supported case, so it is not refusing unconditionally."
    note: "OPT-IN via BRAE_SIMPLEFOAM_V2=1 while the envelope is small, and there is deliberately NO try/catch around it: selected-but-unsupported must stop, never fall through to the old solver. A user who asked for the new path and silently got the old one cannot tell from the output which algorithm produced the answer. ENVELOPE TODAY: steady, laminar, upwind div(phi,U), no MRF/fvOptions/SIMPLEC, no coupled patches. RAS/kEpsilon passes the envelope check and the hook IS now wired to deviceKEpsilonCorrect: the hook also owns the nuEff refresh (nu + nut, boundary value from deviceBoundaryNut's wall function, never the owner cell), which is what makes the lagged coupling work without the driver knowing the model. CONVERGENCE GAP -- FOUND AND FIXED. The CUDA driver allocated its PressureMatrix and folded diagonal fresh every iteration while the AMG hierarchy -- and the V-cycle/PCG graph caches keyed on that fine matrix -- persisted across iterations. Iteration 1 was exact (dU 8.2e-14 from identical inputs) and iteration 2 was wrong by 1.3e-01, with EVERY per-stage test still passing at 1e-16. Fixed by holding the pressure buffers in SolverWorkspace, matching how device_simple_foam.cu keeps them as members. All four drivers (old host, old GPU, _cpp, CUDA) now agree over 60 iterations (iter 59: 2.9136e-02 / 2.914e-02 / 2.91e-02 / 2.91e-02) and the rebuilt solver converges end-to-end: 1.0 -> 0.391 -> 0.0615 -> 0.0284 over 60 iterations. Regression: tests/test_simple_step_cuda.cu gained a multi-iteration mode (ctest simple_step_cuda_loop, 10 iterations, tight solves) -- verified to FAIL (U 1.5e-01, p 3.7e-01) when the buffers are made transient again. TWO EARLIER DIAGNOSES IN THIS INVESTIGATION WERE WRONG and are retracted: the host-vs-GPU 'convergence gap' was a sampling artifact (reading lines 1/5/10/20 of an oscillating series), and the 'HbyA wrong by 42%' was a reference rebuilt without the momentum predictor. Ruled out on the way: bounded, the non-orthogonal correction, solver tolerances, deviceGaussGrad (4e-15), AMG face-weight slicing (no effect -- internal faces already come first). Found and fixed as genuine silent-substitution holes in the envelope guard: `bounded` and the non-orthogonal laplacian correction."

  cuda_vs_reference:
    openfoam:
      symbol: (brae-specific)
      file: "-"
    classification: GPU_REQUIRED
    brae_status: REVALIDATE_EXISTING
    brae_existing: "src/cuda/device_simple.cu, src/cuda/device_fvm.cu"
    brae_target: src/applications/solvers/simpleFoam/
    validation: "tests/test_gpu_vs_cpp.cu -- CUDA against the _cpp reference at STAGE granularity, run on BOTH a laminar case (matrixDumpAsym/282) and a TURBULENT one (pitzDailyTurb/1576, nuEff varying per cell and per boundary face). PRESSURE: rAU 1.5e-16, laplacian upper/lower 0 diag 1.4e-16, pEqn.flux() 0, setReference 0. MOMENTUM: div(phi,U) upper/lower 0 diag 4.6e-18, divDevReff source 4.8e-15/5.6e-16/2.4e-16, H(U) 3.8e-16/2.3e-16/2.4e-16, phiHbyA 0, corrector 0. TURBULENCE: GbyNu 7.6e-17, nut 0. Three controls fire."
    note: "Closes the chain OpenFOAM -> _cpp -> CUDA. Every other GPU test compares the device against CPU code written inline in that same test, which proves consistency but not correctness. Running on a turbulent case as well is what makes it load-bearing: with constant nuEff a kernel that mishandles a per-face diffusivity, or reads the owner cell's value on a wall instead of the patch value, still agrees perfectly. NOT yet compared this way: the linear solves themselves, the wall functions (G0/eps0), and the k/epsilon transport assembly."

  deterministic_assembly:
    openfoam:
      symbol: (brae-specific)
      file: "-"
    classification: GPU_REQUIRED
    brae_status: REUSE_EXISTING
    brae_existing: src/matrices/lduMatrix/lduMatrix/reductions.cu
    brae_target: src/matrices/lduMatrix/lduMatrix/
    validation: "tests/determinism_gate.sh -- pitzDaily (kEpsilon) and pitzDailyKOmega bit-identical over two runs; verified to 200 iterations, plus airfoil and backwardFacingStep2D. Carries a 1-ULP negative control."
    note: "DONE for the incompressible simpleFoam path. Was 3.6e-02 after 20 iterations, now 0. Three scatter sites, all converted to fixed-order gathers: AMG restriction (rc[map[c]] += r[c], hit every level of every V-cycle of every PCG iteration), the turbulence wall functions (cells with >1 wall face), and the eps setValues constraint (cells with >1 constrained face). The last two are RARE -- bit-identical at 1/5/8/10/15 iterations and different at 12 -- so intermittency, not just a systematic offset, is what the gate has to catch. STILL OPEN: the opt-in BRAE_AMG_SA path still scatters, and the cyclic/AMI (42 sites) and distributed (device_halo) paths are untouched."

