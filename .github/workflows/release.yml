name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write        # required to create the release

jobs:
  # Do not release a tag that does not compile: reuse the hosted build-check (sm_80 + sm_90).
  build:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0                       # full history so the notes span since the last tag
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "brae $GITHUB_REF_NAME" --generate-notes
